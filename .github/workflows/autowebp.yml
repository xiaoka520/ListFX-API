name: Generate WebP Photos List with CDN Mirror

on:
  schedule:
    - cron: '0 0 * * *'  # 每天UTC 0点执行（北京时间8点）
  push:
    paths:
      - 'img/**'          # 当img目录有变更时触发
  workflow_dispatch:      # 允许手动触发

jobs:
  generate-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Generate CDN links for WebP
        id: generate-links
        run: |
          mkdir -p tmp
          
          echo "开始处理 WebP 图片..."
          
          # 1. 查找所有webp图片（包括子目录）
          find img/ -type f -iname "*.webp" -print | LC_ALL=C sort > tmp/all_webp.txt
          
          # 记录找到的文件数量
          FILE_COUNT=$(wc -l < tmp/all_webp.txt)
          echo "找到 $FILE_COUNT 个 WebP 文件"
          
          # 2. 使用仓库默认分支生成 CDN 链接
          echo "生成 CDN 链接..."
          CDN_REF="${{ github.event.repository.default_branch }}"
          while IFS= read -r file; do
            # 移除前面的img/路径
            relative_path="${file#img/}"
            
            echo "https://cdn.jsdelivr.net/gh/${{ github.repository }}@${CDN_REF}/img/$relative_path"
          done < tmp/all_webp.txt > photos.txt
          
          # 3. 添加统计信息
          LINK_COUNT=$(wc -l < photos.txt)
          echo "生成 $LINK_COUNT 个有效链接"
          
          # 4. 验证数量、格式以及首个链接是否可访问
          echo "验证链接..."
          if [ "$FILE_COUNT" -eq 0 ] || [ "$FILE_COUNT" -ne "$LINK_COUNT" ]; then
            echo "错误：图片数量与链接数量不一致"
            exit 1
          fi
          grep -q "@${CDN_REF}/img/" photos.txt
          SAMPLE_URL=$(head -n 1 photos.txt)
          curl --fail --silent --show-error --location --retry 3 --head "$SAMPLE_URL" > /dev/null
          echo "链接格式及可访问性验证通过"
          
          # 保存统计信息
          echo "FILE_COUNT=$FILE_COUNT" >> $GITHUB_ENV
          echo "LINK_COUNT=$LINK_COUNT" >> $GITHUB_ENV
          
          # 显示示例链接
          echo "示例链接:"
          head -3 photos.txt

      - name: Create README info
        run: |
          echo "# 图片链接列表" > info.md
          echo "最后更新: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')" >> info.md
          echo "图片数量: ${{ env.FILE_COUNT }}" >> info.md
          echo "有效链接: ${{ env.LINK_COUNT }}" >> info.md
          echo "" >> info.md
          echo "## 示例链接" >> info.md
          head -3 photos.txt | while read url; do
            echo "- [$url]($url)" >> info.md
          done

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: 更新图片列表 (${{ env.LINK_COUNT }} 个链接)"
          file_pattern: |
            photos.txt
            info.md
          commit_user_name: 'GitHub Actions Bot'
          commit_user_email: 'actions@github.com'
          commit_author: 'GitHub Actions <actions@github.com>'
          add: '--all'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload photos.txt as artifact
        uses: actions/upload-artifact@v4
        with:
          name: photos-list
          path: |
            photos.txt
            info.md
          retention-days: 7

      - name: Notify on failure
        if: ${{ failure() }}
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ 图片列表生成失败',
              body: `工作流运行失败！请检查: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
            })
